name: Prepare release version

on:
  push:
    branches:
      - "**"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calver-release
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Prepare current-month CalVer
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $version = & ./scripts/calver.ps1 -Mode Prepare
          if (-not $version -or $version.Count -ne 1) {
            throw 'CalVer preparation did not return exactly one version.'
          }

          git add -- Cargo.toml Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw "git add failed: $LASTEXITCODE" }

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Cargo files already contain CalVer $version."
            exit 0
          }
          if ($LASTEXITCODE -ne 1) { throw "git diff failed: $LASTEXITCODE" }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(release): prepare $version"
          if ($LASTEXITCODE -ne 0) { throw "git commit failed: $LASTEXITCODE" }

          git push origin "HEAD:$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not push the version commit. The default branch may have advanced; rerun this workflow after reviewing the branch.'
          }
